# Pushing a tag like v0.9.0, or starting the workflow on master with a version
# (auto-release.yml does that after an Electron update), builds the release for
# Linux, Windows and macOS,
# writes one checksum list for all of them, signs it for the self-updater,
# attests where each archive was built (verifiable with
# `gh attestation verify <file> -R Edicube/brave-2016`), and publishes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from master, like 0.10.1'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    # a started release only ever comes from master
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-latest
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $version" >&2
            exit 1
          fi
      - name: Version from the started release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: $TAG" >&2
            exit 1
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm test
      - name: Package
        shell: bash
        run: npm run package -- --arch="${PLATFORM#*-}"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Fuses on the packaged build
        shell: bash
        run: node tools/fuses.js --verify "$(node -p "const p = require('./tools/package'); p.binaryIn('dist/' + p.outDir('${{ matrix.platform }}'))")"

      - name: Starts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          # the setuid sandbox helper has to be root-owned 4755 to start at all;
          # the archive is made from a copy below, with ordinary ownership
          cp -a dist/brave-2016-linux-x64 /tmp/smoke-build
          sudo chown root:root /tmp/smoke-build/chrome-sandbox
          sudo chmod 4755 /tmp/smoke-build/chrome-sandbox
          xvfb-run -a node tools/smoke.js /tmp/smoke-build/brave-2016
      - name: Starts (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: node tools/smoke.js --arch="${PLATFORM#*-}"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dir="$(node -p "require('./tools/package').outDir('${PLATFORM}')")"
          case "$PLATFORM" in
            linux-*)
              cp tools/install-linux.sh "dist/$dir/install.sh"
              tar -C dist -czf "brave-2016-${TAG}-${PLATFORM}.tar.gz" "$dir" ;;
            darwin-*)
              # ditto keeps the framework symlinks a zip of the bundle needs
              ditto -c -k --keepParent "dist/$dir/Brave 2016.app" "brave-2016-${TAG}-${PLATFORM}.zip" ;;
            win32-*)
              (cd dist && 7z a -tzip "../brave-2016-${TAG}-${PLATFORM}.zip" "$dir" > /dev/null) ;;
          esac
          ls -la brave-2016-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: brave-2016-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum brave-2016-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the checksum list for the self-updater
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node tools/sign-release.js artifacts/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/brave-2016-*

      - name: Publish
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # --target tags the built commit when the tag does not exist yet
          gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" brave-2016-* SHA256SUMS.txt SHA256SUMS.txt.sig \
            --title "Brave 2016 $TAG" \
            --notes-file - <<NOTES
          **Not safe for everyday use** - see the README for what that means.

          | Platform | File |
          |---|---|
          | Linux x64 | \`brave-2016-${TAG}-linux-x64.tar.gz\` |
          | Windows x64 | \`brave-2016-${TAG}-win32-x64.zip\` |
          | macOS (Apple Silicon) | \`brave-2016-${TAG}-darwin-arm64.zip\` |
          | macOS (Intel) | \`brave-2016-${TAG}-darwin-x64.zip\` |

          Verify before running:

              sha256sum -c --ignore-missing SHA256SUMS.txt
              gh attestation verify <file> -R ${REPO}

          **Linux** - install root-owned, which also enables in-browser updates:

              tar xzf brave-2016-${TAG}-linux-x64.tar.gz
              sudo sh brave-2016-linux-x64/install.sh

          **macOS / Windows** - these builds are not code-signed (that needs paid
          Apple and Windows certificates), so the OS will warn on first launch:
          on macOS right-click the app and choose Open; on Windows choose
          "More info" then "Run anyway". They do not update themselves.
          NOTES
