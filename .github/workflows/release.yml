# Pushing a tag like v0.8.0 builds the packaged Linux release, writes its
# checksums, attests where it was built (verifiable with
# `gh attestation verify <file> -R Edicube/brave-2016`), and publishes it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: node tools/fuses.js --verify "dist/Brave 2016-linux-x64/Brave 2016"

      - name: Archive and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="brave-2016-${TAG}-linux-x64.tar.gz"
          # ship the installer inside, for people who only download the archive
          cp tools/install-linux.sh "dist/Brave 2016-linux-x64/install.sh"
          tar -C dist -czf "$name" "Brave 2016-linux-x64"
          sha256sum "$name" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: brave-2016-${{ github.ref_name }}-linux-x64.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "brave-2016-${TAG}-linux-x64.tar.gz" SHA256SUMS.txt \
            --title "Brave 2016 $TAG" \
            --notes-file - <<NOTES
          Packaged Linux build of Brave 2016 $TAG.

          **Not safe for everyday use** - see the README for what that means.

          Verify the download before running it:

              sha256sum -c SHA256SUMS.txt
              gh attestation verify brave-2016-${TAG}-linux-x64.tar.gz -R ${{ github.repository }}

          Then install it root-owned so the browsing user cannot modify it:

              tar xzf brave-2016-${TAG}-linux-x64.tar.gz
              sudo sh "Brave 2016-linux-x64/install.sh"
          NOTES
