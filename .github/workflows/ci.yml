# Every push and pull request: lint, unit tests, and the end-to-end security
# checks against the real browser. Weekly: the same, plus `npm run doctor`, so
# an Electron major going out of support or a new advisory turns the badge red
# even when nobody has pushed anything.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run verify-fuses
      - run: npm run lint
      - run: npm test
      - name: Display and sandbox for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # Chromium's setuid sandbox helper has to be root-owned 4755
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: End-to-end security checks
        run: xvfb-run -a npm run e2e
      - name: Packaged build starts
        run: |
          npm run package
          sudo chown root:root "dist/Brave 2016-linux-x64/chrome-sandbox"
          sudo chmod 4755 "dist/Brave 2016-linux-x64/chrome-sandbox"
          xvfb-run -a node tools/smoke.js
      - name: Longer fuzzing run (weekly)
        if: github.event_name == 'schedule'
        env:
          FUZZ_RUNS: '200000'
          FUZZ_SEED: ${{ github.run_id }}
        run: node --test test/unit/fuzz.test.js

  # The browser has to build and start on every platform it is released for.
  # On macOS and Windows Electron also verifies the ASAR archive at startup,
  # which only a packaged build exercises.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run verify-fuses
      - run: npm test
      - run: npm run package
      - run: node tools/smoke.js

  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run doctor
