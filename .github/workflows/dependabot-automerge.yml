# Electron patch and minor updates carry Chromium security fixes, so they
# merge on their own once every required CI check has passed (branch
# protection on master makes auto-merge wait for them). Majors, and every
# other dependency, still wait for a person.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Edicube/brave-2016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for Electron patch and minor updates
        if: >-
          steps.meta.outputs.dependency-names == 'electron' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
